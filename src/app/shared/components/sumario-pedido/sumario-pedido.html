<section class="rounded-2xl border border-slate-200 bg-white p-6 sm:p-8 space-y-4">
  @if(exibirTitulo()) {
  <h3 class="font-semibold text-slate-900">Resumo do pedido</h3>
  }

  @let pedidoDetalhes = pedido();

  <div class="grid grid-cols-[auto_1fr] grid-rows-[auto_1fr] gap-x-4">
    <span class="bg-primary-200 row-span-2 rounded-xl size-15 p-1 grid place-items-center">
      <i class="fa-solid fa-table-cells-large text-5xl text-primary"></i>
    </span>
    <p class="mt-2 text-xl font-semibold">{{ pedidoDetalhes.produto.titulo }}</p>
    <p class="text-sm text-slate-500">{{ tipoPlano() }} - {{ quantidadeUsuarios() }}</p>
  </div>

  @for (benefit of pedidoDetalhes.produto.caracteristicas; track benefit) {
  <ul>
    <li class="text-sm text-slate-500"><i class="fa-solid fa-check text-primary"></i> {{ benefit }}</li>
  </ul>
  }

  <span class="mx-1.5 block h-0.5 bg-slate-200 sm:mx-3.5" aria-hidden="true"></span>

  <ng-content></ng-content>

</section>
