<fieldset [disabled]="processandoPagamento()" class="space-y-5">
    <legend class="text-xl font-semibold">{{ tituloMetodoPagamento() }}</legend>

    <div>
        <label for="numeroCartao" class="block text-sm font-medium">Número do cartão</label>

        <!-- TODO: formatar (blur)="formatNumber()" -->
        <input id="numeroCartao" type="text" inputmode="numeric" [formField]="formulario.numeroCartao"
            class="mt-2 block w-full rounded-lg border border-slate-300 bg-white p-3 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-slate-900" />

        @if (erro('numeroCartao'); as message) {
        <p id="numeroCartao-erro" role="alert" class="mt-1 text-sm text-red-800">
            {{ message }}
        </p>
        }
    </div>

    <div>
        <label for="nomeCartao" class="block text-sm font-medium">Nome no cartão</label>

        <input id="nomeCartao" type="text" [formField]="formulario.nomeCartao"
            class="mt-2 block w-full rounded-lg border border-slate-300 bg-white p-3 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-slate-900" />

        @if (erro('nomeCartao'); as message) {
        <p id="nomeCartao-erro" role="alert" class="mt-1 text-sm text-red-800">
            {{ message }}
        </p>
        }
    </div>

    <div>
        <label for="validade" class="block text-sm font-medium">Validade</label>

        <!-- TODO: formatar (blur)="formatExpiry()" -->
        <input id="validade" type="text" inputmode="numeric" [formField]="formulario.validade"
            class="mt-2 block w-full rounded-lg border border-slate-300 bg-white p-3 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-slate-900" />

        @if (erro('validade'); as message) {
        <p id="card-expiry-erro" role="alert" class="mt-1 text-sm text-red-800">{{ message }}</p>
        }
    </div>

    <div>
        <label for="cvv" class="block text-sm font-medium">CVV</label>

        <input id="cvv" type="password" inputmode="numeric" [formField]="formulario.cvv"
            class="mt-2 block w-full rounded-lg border border-slate-300 bg-white p-3 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-slate-900" />

        @if (erro('cvv'); as message) {
        <p id="card-cvv-erro" role="alert" class="mt-1 text-sm text-red-800">{{ message }}</p>
        }
    </div>

    <button type="submit" [disabled]="processandoPagamento()"
        class="rounded-lg bg-slate-900 px-5 py-3 font-medium text-white hover:bg-slate-700 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-slate-900">
        {{ processandoPagamento() ? 'Processando pagamento…' : 'Concluir pagamento' }}
    </button>
</fieldset>
