<fieldset class="flex flex-col space-y-5">
    <legend class="text-xl font-semibold">{{ tituloMeioPagamento() }}</legend>

    <div>
        <label for="numeroCartao" class="block text-sm font-medium">Número do cartão</label>

        <input id="numeroCartao" type="text" inputmode="numeric" [formField]="formulario.numeroCartao"
            (input)="atualizarNumeroCartao($event)" placeholder="0000 0000 0000 0000"
            class="mt-2 block w-full rounded-lg border border-slate-300 bg-white p-3 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-slate-900"
            [attr.aria-invalid]="formulario.numeroCartao().touched() && formulario.numeroCartao().invalid()"
            [attr.aria-describedby]="erro('numeroCartao') ? 'numeroCartao-erro' : null" />

        @if (erro('numeroCartao'); as mensagem) {
        <p id="numeroCartao-erro" role="alert" class="mt-1 text-sm text-red-800">
            {{ mensagem }}
        </p>
        }
    </div>

    <div>
        <label for="nomeCartao" class="block text-sm font-medium">Nome no cartão</label>

        <input id="nomeCartao" type="text" [formField]="formulario.nomeCartao" (input)="atualizarNomeCartao($event)"
            class="mt-2 block w-full rounded-lg border border-slate-300 bg-white p-3 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-slate-900"
            [attr.aria-invalid]="formulario.nomeCartao().touched() && formulario.nomeCartao().invalid()"
            placeholder="Nome completo como aparece no cartão"
            [attr.aria-describedby]="erro('nomeCartao') ? 'nomeCartao-erro' : null" />

        @if (erro('nomeCartao'); as mensagem) {
        <p id="nomeCartao-erro" role="alert" class="mt-1 text-sm text-red-800">
            {{ mensagem }}
        </p>
        }
    </div>

    <div>
        <label for="validade" class="block text-sm font-medium">Validade</label>

        <input id="validade" type="text" inputmode="numeric" [formField]="formulario.validade"
            (input)="atualizarValidade($event)" placeholder="MM/AA"
            class="mt-2 block w-full rounded-lg border border-slate-300 bg-white p-3 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-slate-900"
            [attr.aria-invalid]="formulario.validade().touched() && formulario.validade().invalid()"
            [attr.aria-describedby]="erro('validade') ? 'validade-erro' : null" />

        @if (erro('validade'); as mensagem) {
        <p id="validade-erro" role="alert" class="mt-1 text-sm text-red-800">
            {{ mensagem }}
        </p>
        }
    </div>

    <div>
        <label for="cvv" class="block text-sm font-medium">CVV</label>

        <input id="cvv" type="text" inputmode="numeric" [formField]="formulario.cvv" (input)="atualizarCvv($event)"
            class="mt-2 block w-full rounded-lg border border-slate-300 bg-white p-3 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-slate-900"
            [attr.aria-invalid]="formulario.cvv().touched() && formulario.cvv().invalid()" placeholder="000"
            [attr.aria-describedby]="erro('cvv') ? 'cvv-erro' : null" />

        @if (erro('cvv'); as mensagem) {
        <p id="cvv-erro" role="alert" class="mt-1 text-sm text-red-800">
            {{ mensagem }}
        </p>
        }
    </div>

    <button type="submit" (click)="concluirPagamento()"
        class="w-52 self-end rounded-lg bg-primary-900 px-5 py-3 font-medium text-white hover:bg-primary-700 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary-900">
        Concluir pagamento
    </button>
</fieldset>
