<div class="flex w-full flex-col items-center justify-center text-center" role="status" aria-live="polite"
    aria-atomic="true">

    @let estadoOperacao = estado();

    <div class="mb-8 flex size-24 shrink-0 items-center justify-center rounded-full " aria-hidden="true"
        [class.bg-primary-50]="estadoOperacao === 'carregamento'" [class.bg-green-100]="estadoOperacao === 'sucesso'"
        [class.bg-red-100]="estadoOperacao === 'erro'">

        @if(estadoOperacao === 'carregamento') {
        <span
            class="block size-12 animate-spin rounded-full border-4 border-primary border-t-transparent motion-reduce:animate-none"></span>
        } @else {
        <i class="fa-solid text-5xl" [class.text-green-500]="estadoOperacao === 'sucesso'"
            [class.text-red-500]="estadoOperacao === 'erro'" [class.fa-check]="estadoOperacao === 'sucesso'"
            [class.fa-xmark]="estadoOperacao === 'erro'"></i>
        }
    </div>

    <p class="max-w-full text-2xl font-semibold leading-8 text-slate-900 wrap-anywhere">{{ titulo() }}</p>

    @if(descricao(); as descricao) {
    <p class="mt-3 max-w-md text-base leading-6 text-slate-500 wrap-anywhere">{{ descricao }}</p>
    }
</div>
