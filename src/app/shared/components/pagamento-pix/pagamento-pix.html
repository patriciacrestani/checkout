<div class="flex flex-col space-y-5">
    @if(carregando()) {
    <app-carregamento titulo="Carregando código PIX..." />
    } @else if(codigoPix(); as codigoPix) {
    <h3 class="text-xl font-semibold">Pague com seu app do banco</h3>

    <p class="leading-7 text-slate-600">
        Abra a opção Pix e escaneie o QR Code ou use o código abaixo. Depois, conclua o pagamento.
    </p>

    <figure class="flex flex-col gap-2 items-center">
        <img class="rounded-2xl border border-slate-200 bg-white" src="assets/qr-decorativo.png"
            alt="QR Code simulado - sem valor de pagamento." width="300" height="300" />
        <figcaption class="mt-2 text-sm text-neutral-500">QR Code simulado - sem valor de pagamento.</figcaption>
    </figure>

    <p class="leading-7 text-slate-600">
        Pix copia e cola.
    </p>

    <app-codigo-pix [codigoPix]="codigoPix" />

    <button type="submit" (click)="concluirPagamento()"
        class="w-56 self-end rounded-lg bg-primary-900 px-5 py-3 font-medium text-white hover:cursor-pointer hover:bg-primary-700 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary-900">
        <i class="fa-solid fa-arrow-right-long text-white pr-2"></i>
        Concluir pagamento
    </button>
    } @else {
    @let descricaoErro = erro();
    <app-erro [titulo]="'Não foi possível obter o código PIX.'" [descricao]="descricaoErro ?? ''" />
    }
</div>
