<div class="flex flex-col space-y-4">

    @let pedidoDetalhes = pedido();

    <div class="flex justify-between">
        <span class="text-sm text-slate-500">Pedido</span>
        <span class="text-sm text-slate-500">{{ pedidoDetalhes.numeroPedido }}</span>
    </div>

    <div class="flex justify-between">
        <span class="text-sm text-slate-500">Pagamento</span>
        <span class="text-sm text-slate-500">{{ detalhesPagamento() }}</span>
    </div>

    <div class="flex justify-between">
        <span class="text-sm text-slate-500">Data</span>
        <span class="text-sm text-slate-500">{{ pedidoDetalhes.data | date:'dd/MM/yyyy HH:mm' }}</span>
    </div>

    <span class="mx-1.5 block h-0.5 bg-slate-200 sm:mx-3.5" aria-hidden="true"></span>

    <div class="flex justify-between items-end">
        <span class="text-sm font-semibold text-gray-900">Total pago</span>
        <span class="font-semibold text-xl text-gray-900">{{ pedidoDetalhes.valorTotal| currency: 'BRL' : 'symbol' :
            '1.2-2'
            :
            'pt-BR'
            }}</span>
    </div>
</div>
