<main
  class="mx-auto max-w-xl sm:max-w-2xl lg:max-w-4xl xl:max-w-5xl 2xl:max-w-7xl px-6 py-10 sm:py-16 flex flex-col space-y-4"
  aria-labelledby="payment-title">
  <h2 appRouteHeading id="payment-title" class="text-3xl font-semibold tracking-tight sm:text-4xl">
    Finalize sua assinatura
  </h2>

  <p class="leading-7 text-slate-600">
    Falta só um passo para começar com Nexo Pro.
  </p>

  <div class="flex gap-4">
    <section class="w-3/5 rounded-2xl border border-slate-200 bg-white p-6 sm:p-8  flex flex-col space-y-4">
      <app-seletor-meio-pagamento (mudarMeioPagamento)="mudarMeioPagamento($event)" />

      @let meioPagamento = meioPagamentoSelecionado();
      @if(meioPagamento) {
      <div id="payment-method-content">

        @if (meioPagamento === meioPagamentoEnum.Pix) {
        <!-- <app-pix-payment [pix]="pixCode()!" [order]="order!" (processPixPayment)="payPix()" /> -->
        } @else {
        <app-formulario-cartao [meioPagamento]="meioPagamento!" [desabilitarFormulario]="processandoPagamento()"
          (enviarDadosCartao)="enviarDadosCartao($event)" />
        }
      </div>
      }
    </section>

    @let pedido = store.pedido();
    @if(pedido) {
    <app-sumario-pedido [pedido]="pedido" [exibirTitulo]="true" />
    }
  </div>

  <a routerLink="/checkout/pedido"
    class="mt-12 font-medium text-slate-600 hover:cursor-pointer hover:text-slate-500 hover:underline ">
    Voltar para o pedido
  </a>
</main>
