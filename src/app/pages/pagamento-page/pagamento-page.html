<main class="mx-auto max-w-xl sm:max-w-2xl lg:max-w-4xl xl:max-w-5xl 2xl:max-w-7xl px-6 py-10 sm:py-16"
  aria-labelledby="payment-title">
  <h2 appRouteHeading id="payment-title" class="text-3xl font-semibold tracking-tight sm:text-4xl">
    Finalize sua assinatura
  </h2>

  <p class="mt-3 leading-7 text-slate-600">
    Falta só um passo para começar com Nexo Pro.
  </p>

  <div class="mt-8">

    <div class="flex gap-4">
      <section class="w-3/5 rounded-2xl border border-slate-200 bg-white p-6 sm:p-8 space-y-4">
        <app-seletor-meio-pagamento (mudarMeioPagamento)="mudarMeioPagamento($event)" />

        <div id="payment-method-content">
          @let meioPagamento = meioPagamentoSelecionado();

          @if (meioPagamento === meioPagamentoEnum.Pix) {
          <!-- <app-pix-payment [pix]="pixCode()!" [order]="order!" (processPixPayment)="payPix()" /> -->
          } @else {
          <app-formulario-cartao [meioPagamento]="meioPagamento!" />
          }
        </div>
      </section>

      @let pedido = store.pedido();
      @if(pedido) {
      <app-sumario-pedido [pedido]="pedido" [exibirTitulo]="true" />

      }
    </div>

    <button type="button" (click)="voltarParaPedido()"
      class="mt-8 rounded-lg border border-slate-300 px-6 py-3 font-medium hover:bg-slate-100 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-slate-900 disabled:cursor-not-allowed disabled:opacity-50">
      Voltar para o pedido
    </button>
  </div>
</main>
